<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>卡片 Card</title>
<style>
:root{--primary:#ff8a5b;--accent:#ffc46b;--surface:#fff;--surface2:#f6f1ea;--text:#3f3833;--text2:#7a7065;--text3:#968b7e;--border:#ece3d8;--bg:#faf6f1;
--r-lg:24px;--shadow-sm:0 1px 2px rgba(60,45,35,.04);--shadow:0 4px 16px rgba(60,45,35,.06)}
*{box-sizing:border-box}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:28px}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--text3);font-size:13px;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);padding:22px;border:1px solid var(--border)}
.section-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
.sh-badge{width:27px;height:27px;border-radius:9px;background:var(--surface2);display:inline-grid;place-items:center;font-size:15px;border:1px solid var(--border)}
.stat{font-size:30px;font-weight:800;line-height:1.1;margin-top:8px}
.stat-label{font-size:12px;color:var(--text3);margin-top:3px}
.bar{height:8px;border-radius:999px;background:#efe8df;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent))}
</style></head><body>
<h1>🗂️ 卡片 Card</h1><p class="sub">内容容器：标准卡、统计卡、带进度卡。圆角 24、轻阴影、1px 暖边。</p>
<div class="grid">
  <div class="card">
    <div class="section-title"><span class="sh-badge">🎐</span>此刻的心情</div>
    <div class="stat-label" style="margin-top:8px">三秒点选，让小暖懂你今天</div>
  </div>
  <div class="card">
    <div class="stat-label">和小暖聊过</div>
    <div class="stat">36<span style="font-size:14px"> 次</span></div>
  </div>
  <div class="card">
    <div class="stat-label">班级心理温度</div>
    <div class="stat" style="color:#f4703f">78<span style="font-size:14px"> 分</span></div>
    <div class="bar"><i style="width:78%"></i></div>
  </div>
</div>
</body></html>
