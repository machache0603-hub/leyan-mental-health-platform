<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>输入 Input</title>
<style>
:root{--primary:#ff8a5b;--primary-soft:#ffb088;--surface:#fff;--text:#3f3833;--text2:#7a7065;--text3:#968b7e;--border:#ece3d8;--bg:#faf6f1;--r-md:16px}
*{box-sizing:border-box}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:28px}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--text3);font-size:13px;margin:0 0 22px}
.field{max-width:420px;margin-bottom:16px}
.lab{display:block;font-size:12.5px;color:var(--text2);font-weight:600;margin:0 0 6px}
.input,.textarea{width:100%;padding:11px 15px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit}
.input:focus,.textarea:focus{outline:none;border-color:var(--primary-soft);box-shadow:0 0 0 4px rgba(255,138,91,.12)}
.input::placeholder,.textarea::placeholder{color:var(--text3)}
.textarea{min-height:90px;line-height:1.6;resize:vertical}
.hint{font-size:11.5px;color:var(--text3);margin-top:6px}
</style></head><body>
<h1>⌨️ 输入 Input & Textarea</h1><p class="sub">聚焦时主色描边 + 4px 柔光环。占位提示用 text-3。</p>
<div class="field"><label class="lab">学号</label><input class="input" placeholder="请输入学号" value="2026010188"></div>
<div class="field"><label class="lab">想画点什么？</label><textarea class="textarea" placeholder="例如：我想画一片很安静的海，月光洒在上面…"></textarea><div class="hint">最多 500 字，描述越具体，小暖画得越懂你。</div></div>
</body></html>
