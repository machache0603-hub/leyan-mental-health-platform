<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>字阶</title>
<style>
:root{--bg:#faf6f1;--surface:#fff;--text:#3f3833;--text2:#7a7065;--text3:#968b7e;--border:#ece3d8;--primary-deep:#f4703f}
*{box-sizing:border-box}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:28px}
h1{font-size:21px;margin:0 0 4px}.sub{color:var(--text3);font-size:13px;margin:0 0 22px}
.row{display:flex;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.tok{width:120px;flex-shrink:0;font-family:Consolas,monospace;font-size:12px;color:var(--text3)}
.spec{width:90px;flex-shrink:0;font-size:11px;color:var(--text3)}
.sample{color:var(--text)}
</style></head><body>
<h1>🔤 字阶</h1><p class="sub">约 1.25 模块化比例。正文字体 Microsoft YaHei / PingFang SC。</p>
<div class="row"><span class="tok">--fs-3xl</span><span class="spec">33px / 800</span><span class="sample" style="font-size:33px;font-weight:800">乐颜 · 暖心首页</span></div>
<div class="row"><span class="tok">--fs-2xl</span><span class="spec">26px / 800</span><span class="sample" style="font-size:26px;font-weight:800">今日暖心签</span></div>
<div class="row"><span class="tok">--fs-xl</span><span class="spec">21px / 700</span><span class="sample" style="font-size:21px;font-weight:700">心理健康关爱平台</span></div>
<div class="row"><span class="tok">--fs-lg</span><span class="spec">17px / 700</span><span class="sample" style="font-size:17px;font-weight:700">区块标题 Section Title</span></div>
<div class="row"><span class="tok">--fs-md</span><span class="spec">14px / 400</span><span class="sample" style="font-size:14px">正文：一盏永远亮着的小夜灯，是温暖的陪伴。</span></div>
<div class="row"><span class="tok">--fs-sm</span><span class="spec">12.5px / 500</span><span class="sample" style="font-size:12.5px;color:var(--text2)">次要说明文字 / 标签</span></div>
<div class="row"><span class="tok">--fs-xs</span><span class="spec">11px / 700</span><span class="sample" style="font-size:11px;color:var(--text3);letter-spacing:1px">分组小标 CAPTION</span></div>
</body></html>
